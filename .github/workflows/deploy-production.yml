name: FLOW Deploy Production (Enterprise Core)

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy-production:
    name: Build, Audit & Ship to Multi-AZ Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: https://api.flow.com
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Check CI status
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: exit 1

      - name: Configure AWS Credentials Secure Session
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY_PROD }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Private Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag and Ship to ECR Production
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: flow-platform-prod
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Register ECS task definition
        run: >
          aws ecs register-task-definition
          --family flow-app
          --container-definitions
          '[{"name":"flow-app","imageUri":"${{ steps.login-ecr.outputs.registry }}/flow-platform-prod:${{ github.sha }}"}]'

      - name: Deploy Task Definition to ECS Orchestrator
        run: |
          aws ecs update-service --cluster flow-production-cluster --service flow-prod-web-service --force-new-deployment

      - name: Broadcast Deployment Complete Event
        run: |
          echo "Shipment of Version ${{ github.sha }} broadcasted via Sentry and Webhook channels."
