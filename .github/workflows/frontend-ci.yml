name: FLOW Frontend CI (Continous Integration)

on:
  push:
    branches: [main, master, development]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package*.json'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package*.json'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Type Checks
        run: npm run lint

      - name: Build Web Application (React+Vite)
        run: npx vite build

      - name: Verify Static Deliverables
        run: |
          echo "Inspecting SPA assets layout distribution..."
          node -e "const fs = require('fs'); if (fs.existsSync('./dist/index.html')) { console.log('Static Assets compiled perfectly!'); process.exit(0); } else { console.log('Assets build failed.'); process.exit(1); }"
