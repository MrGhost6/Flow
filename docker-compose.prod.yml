version: '3.8'

services:
  # 🌐 Production Ingress API Router & App
  flow-app-prod:
    image: flow-platform/app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow-production-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://flow_db_administrator:vEryS3cur3P@ssw0rd_99!@prod-rds.crw3m.rds.amazonaws.com:5432/flow_production
      - REDIS_URL=redis://prod-cache-redis.crw3m.clustercfg.use1.cache.amazonaws.com:6379/0
      - JWT_SECRET=flow-production-token-super-high-entropy-signature-key-2026
      - REFRESH_SECRET=flow-production-refresh-token-super-high-entropy-signature-key-2026
      - AWS_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE_PROD
      - AWS_SECRET_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY_PROD
      - SENTRY_DSN=https://prod-abcdef123@sentry.io/45012345678
      - API_BASE_URL=https://api.flow.com
    networks:
      - flow-prod-net

  # ⚙️ Production Queue Workers & Report Aggregator
  flow-worker-prod:
    image: flow-platform/app:latest
    container_name: flow-production-worker
    restart: always
    command: ["node", "dist/server.cjs", "--mode=worker"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://flow_db_administrator:vEryS3cur3P@ssw0rd_99!@prod-rds.crw3m.rds.amazonaws.com:5432/flow_production
      - REDIS_URL=redis://prod-cache-redis.crw3m.clustercfg.use1.cache.amazonaws.com:6379/1
