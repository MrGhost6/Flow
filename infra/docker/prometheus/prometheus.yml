global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "flow-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3001"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "flow-backend"

  - job_name: "flow-redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "flow-redis"

  - job_name: "flow-postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "flow-postgres"

  - job_name: "flow-node"
    static_configs:
      - targets: ["host.docker.internal:9464"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "flow-node-exporter"

  - job_name: "flow-minio"
    metrics_path: "/minio/v2/metrics/cluster"
    static_configs:
      - targets: ["minio:9000"]
