version: '3.8'

services:
  # 🌐 FLOW Core Multi-Currency Web & Backend API Service
  flow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow-platform-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://flow_admin:secure_postgres_pass@postgres-db:5432/flow_ledger
      - REDIS_URL=redis://redis-cache:6379/0
      - JWT_SECRET=flow-development-secret-jwt-signing-key
      - REFRESH_SECRET=flow-development-secret-refresh-signing-key
      - AWS_ACCESS_KEY=local-dev-aws-key
      - AWS_SECRET_KEY=local-dev-aws-secret-access-key
      - SENTRY_DSN=
      - API_BASE_URL=http://localhost:3000
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - flow-network

  # ⚙️ Asynchronous Queue & Ledger Clearing Worker Service
  flow-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow-background-worker
    command: ["node", "dist/server.cjs", "--mode=worker"]
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://flow_admin:secure_postgres_pass@postgres-db:5432/flow_ledger
      - REDIS_URL=redis://redis-cache:6379/1
      - JWT_SECRET=flow-development-secret-jwt-signing-key
    depends_on:
      redis-cache:
        condition: service_healthy
    networks:
      - flow-network

  # 🐘 Core Relational Ledger Storage DB
  postgres-db:
    image: postgres:15-alpine
    container_name: flow-postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=flow_admin
      - POSTGRES_PASSWORD=secure_postgres_pass
      - POSTGRES_DB=flow_ledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow_admin -d flow_ledger"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flow-network

  # 🏎️ Redis Cache & Queue Message Broker
  redis-cache:
    image: redis:7-alpine
    container_name: flow-redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flow-network

  # 📊 Monitoring & Observability Stack (Prometheus)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: flow-monitoring-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - flow-network

  # 📈 Operational Metrics Dashboard Drawer (Grafana)
  grafana:
    image: grafana/grafana-oss:10.0.0
    container_name: flow-monitoring-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - flow-network

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  flow-network:
    driver: bridge
